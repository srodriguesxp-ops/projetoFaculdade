spring.application.name=mister-money-api
server.port=8081

# Sobrescreva a URL completa se precisar de NTLM ou de outro servidor:
# jdbc:sqlserver://HOST:1433;databaseName=MisterMoney;authenticationScheme=NTLM;user=DOMINIO\\USUARIO;password=SENHA;encrypt=false;trustServerCertificate=true
spring.datasource.url=${MSSQL_JDBC_URL:jdbc:sqlserver://${MSSQL_SERVER:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DATABASE:MisterMoney};integratedSecurity=true;encrypt=${MSSQL_ENCRYPT:false};trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${MSSQL_USER:}
spring.datasource.password=${MSSQL_PASSWORD:}

mistermoney.seed.enabled=${MSSQL_SEED_ENABLED:true}
